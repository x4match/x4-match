name: Deploy API (EC2)

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'infra/aws/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

concurrency:
  group: deploy-api-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy on EC2
    # Runner instalado en la misma EC2 (evita abrir SSH a internet).
    runs-on: [self-hosted, linux, x64, ec2]
    environment: production
    steps:
      - name: Deploy
        run: |
          set -euo pipefail
          cd /opt/x4match
          bash infra/aws/deploy.sh
